name: Monitor Upstream

on:
  schedule:
    - cron: "0 8 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  monitor:
    if: github.repository == 'motlin/oxc-next-line'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 1
          persist-credentials: false

      - name: Compare with upstream
        id: upstream
        shell: bash
        run: |
          repository=$(node -p 'require("./.upstream.json").repository')
          branch=$(node -p 'require("./.upstream.json").branch')
          recorded_commit=$(node -p 'require("./.upstream.json").commit')
          recorded_release=$(node -p 'require("./.upstream.json").release')

          git remote add upstream "https://github.com/$repository.git"
          git fetch --quiet --tags upstream "$branch"

          current_commit=$(git rev-parse "upstream/$branch")
          current_release=$(git describe --tags --abbrev=0 --match "oxfmt_v*" "upstream/$branch")
          commit_count=$(git rev-list --count "$recorded_commit..upstream/$branch")

          {
            echo "repository=$repository"
            echo "branch=$branch"
            echo "recorded_commit=$recorded_commit"
            echo "current_commit=$current_commit"
            echo "recorded_release=$recorded_release"
            echo "current_release=$current_release"
            echo "commit_count=$commit_count"
          } >> "$GITHUB_OUTPUT"

      - name: Update upstream drift issue
        uses: actions/github-script@f28e40c7f34bde8b3046d885e986cb6290c5673b # v7.1.0
        env:
          UPSTREAM_REPOSITORY: ${{ steps.upstream.outputs.repository }}
          UPSTREAM_BRANCH: ${{ steps.upstream.outputs.branch }}
          RECORDED_COMMIT: ${{ steps.upstream.outputs.recorded_commit }}
          CURRENT_COMMIT: ${{ steps.upstream.outputs.current_commit }}
          RECORDED_RELEASE: ${{ steps.upstream.outputs.recorded_release }}
          CURRENT_RELEASE: ${{ steps.upstream.outputs.current_release }}
          COMMIT_COUNT: ${{ steps.upstream.outputs.commit_count }}
        with:
          script: |
            const marker = "<!-- upstream-drift -->";
            const issues = await github.paginate(github.rest.issues.listForRepo, {
              ...context.repo,
              state: "open",
              per_page: 100,
            });
            const issue = issues.find((candidate) =>
              candidate.body?.includes(marker),
            );
            const changed =
              process.env.RECORDED_COMMIT !== process.env.CURRENT_COMMIT ||
              process.env.RECORDED_RELEASE !== process.env.CURRENT_RELEASE;

            if (!changed) {
              if (issue) {
                await github.rest.issues.update({
                  ...context.repo,
                  issue_number: issue.number,
                  state: "closed",
                });
              }
              return;
            }

            const compareUrl =
              `https://github.com/${process.env.UPSTREAM_REPOSITORY}/compare/` +
              `${process.env.RECORDED_COMMIT}...${process.env.CURRENT_COMMIT}`;
            const body = [
              marker,
              `Upstream \`${process.env.UPSTREAM_REPOSITORY}\` has changed.`,
              "",
              `- Branch: \`${process.env.UPSTREAM_BRANCH}\``,
              `- New commits: ${process.env.COMMIT_COUNT}`,
              `- Recorded release: \`${process.env.RECORDED_RELEASE}\``,
              `- Current release: \`${process.env.CURRENT_RELEASE}\``,
              `- [Compare changes](${compareUrl})`,
              "",
              "Replay the fork branches onto upstream, resolve conflicts, run the full checks, update `.upstream.json`, and publish a new fork release only when the resulting package changes.",
            ].join("\n");
            const title = "Replay new upstream changes";

            if (issue) {
              await github.rest.issues.update({
                ...context.repo,
                issue_number: issue.number,
                title,
                body,
              });
            } else {
              await github.rest.issues.create({
                ...context.repo,
                title,
                body,
              });
            }
